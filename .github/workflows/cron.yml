name: Automatisation quotidienne XWIN

on:
  schedule:
    - cron: "0 7 * * *"   # alimentation des pronos
    - cron: "0 21 * * *"  # bilan du jour
  workflow_dispatch: {}    # bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  pronos:
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Déclenche l'alimentation des pronos
        run: curl -fsS "${{ secrets.SITE_URL }}/api/cron/pronos?secret=${{ secrets.CRON_SECRET }}"

  daily-recap:
    if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Déclenche le bilan quotidien
        run: curl -fsS "${{ secrets.SITE_URL }}/api/cron/daily-recap?secret=${{ secrets.CRON_SECRET }}"
